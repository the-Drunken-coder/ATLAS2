name: Integration (Docker stack)

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  integration:
    name: Cross-service Docker integration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: atlas-core/go.mod
          cache-dependency-path: atlas-core/go.sum

      - name: Build service images
        working-directory: atlas-core
        env:
          ATLAS_DATASTORAGE_INTERNAL_TOKEN: integration-test-token
        run: docker compose -f docker-compose.yml -f docker-compose.integration.yml build atlas-datastorage atlas-functions

      - name: Start stack
        working-directory: atlas-core
        env:
          ATLAS_DATASTORAGE_INTERNAL_TOKEN: integration-test-token
        run: docker compose -f docker-compose.yml -f docker-compose.integration.yml up -d --wait

      - name: Run integration tests
        working-directory: atlas-core
        run: go test -tags=integration ./integration/... -v -count=1 -timeout 5m

      - name: Cleanup
        if: always()
        working-directory: atlas-core
        env:
          ATLAS_DATASTORAGE_INTERNAL_TOKEN: integration-test-token
        run: docker compose -f docker-compose.yml -f docker-compose.integration.yml down -v --remove-orphans
