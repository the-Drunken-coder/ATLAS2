name: Integration (Docker stack)

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  integration:
    name: Cross-service Docker integration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: atlas-core/go.mod
          cache-dependency-path: atlas-core/go.sum

      - name: Build service images
        working-directory: atlas-core
        env:
          ATLAS_DATASTORAGE_INTERNAL_TOKEN: integration-test-token
        run: docker compose -f docker-compose.yml -f docker-compose.integration.yml build atlas-datastorage atlas-functions

      - name: Start stack
        working-directory: atlas-core
        env:
          ATLAS_DATASTORAGE_INTERNAL_TOKEN: integration-test-token
        run: docker compose -f docker-compose.yml -f docker-compose.integration.yml up -d --wait

      - name: Wait for stack readiness
        run: |
          echo "Waiting for stack to be ready at http://127.0.0.1:8080..."
          for i in {1..30}; do
            if curl -f -s http://127.0.0.1:8080 > /dev/null 2>&1; then
              echo "Stack is ready after $i attempts"
              exit 0
            fi
            echo "Attempt $i/30 failed, retrying in 2s..."
            sleep 2
          done
          echo "Stack failed to become ready after 30 attempts (60s timeout)"
          exit 1

      - name: Run integration tests
        working-directory: atlas-core
        env:
          ATLAS_INTEGRATION_EXTERNAL: "1"
        run: go test -tags=integration ./integration/... -v -count=1 -timeout 5m

      - name: Cleanup
        if: always()
        working-directory: atlas-core
        env:
          ATLAS_DATASTORAGE_INTERNAL_TOKEN: integration-test-token
        run: docker compose -f docker-compose.yml -f docker-compose.integration.yml down -v --remove-orphans
