name: Integration (Docker stack)

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  docker-stack:
    name: Compose via atlas.py
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Host bind only (atlas-core still uses service hostname `postgres:5432`).
      ATLAS_POSTGRES_HOST_PORT: "15432"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable corepack
        run: corepack enable

      - name: Start stack (build + up + health wait)
        run: python3 atlas.py start

      - name: Verify services are up
        working-directory: atlas-core
        run: |
          set -euo pipefail
          expected="$(docker compose config --services | wc -l | awk '{print $1}')"
          running="$(docker compose ps --services --filter "status=running" | wc -l | awk '{print $1}')"
          if [ "${running}" -ne "${expected}" ]; then
            echo "Expected ${expected} running services (from compose config), saw ${running} with status=running." >&2
            docker compose ps
            exit 1
          fi

      - name: Stop stack
        if: always()
        run: python3 atlas.py stop
