name: Integration (Docker stack)

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  docker-stack:
    name: Compose via atlas.py
    runs-on: ubuntu-latest
    env:
      # Host bind only (atlas-core still uses service hostname `postgres:5432`).
      ATLAS_POSTGRES_HOST_PORT: "15432"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Start stack (build + up + health wait)
        run: python3 atlas.py start

      - name: Verify services are up
        working-directory: atlas-core
        run: docker compose ps

      - name: Stop stack
        if: always()
        run: python3 atlas.py stop
