name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  architecture:
    name: Architecture (atlas.py architecture-check)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@4a3601121dd01d1626a1e23e37211e3254c1c06c

      - name: Verify service boundary invariants
        run: python3 atlas.py architecture-check

  contracts:
    name: Contracts (atlas.py codegen-check)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@4a3601121dd01d1626a1e23e37211e3254c1c06c

      - name: Set up Go
        uses: actions/setup-go@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          go-version-file: atlas-core/go.mod
          cache-dependency-path: atlas-core/go.sum

      - name: Install protoc
        run: |
          # Match the protoc major used to generate committed stubs (apt's 3.x rewrites version headers).
          # Release v34.1 reports as protoc v7.x in generated .pb.go file headers; codegen-check compares output only.
          curl -fsSL -o /tmp/protoc.zip \
            https://github.com/protocolbuffers/protobuf/releases/download/v34.1/protoc-34.1-linux-x86_64.zip
          echo "af27ea66cd26938fe48587804ca7d4817457a08350021a1c6e23a27ccc8c6904  /tmp/protoc.zip" | sha256sum -c -
          sudo unzip -o /tmp/protoc.zip -d /usr/local
          protoc --version

      - name: Verify generated gRPC code
        run: python3 atlas.py codegen-check

  format:
    name: Format (gofmt)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: atlas-core
    steps:
      - name: Checkout
        uses: actions/checkout@4a3601121dd01d1626a1e23e37211e3254c1c06c

      - name: Set up Go
        uses: actions/setup-go@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          go-version-file: atlas-core/go.mod
          cache-dependency-path: atlas-core/go.sum

      - name: Download modules
        run: go mod download

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "$unformatted"
            exit 1
          fi

  lint:
    name: Lint (golangci-lint)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@4a3601121dd01d1626a1e23e37211e3254c1c06c

      - name: Set up Go
        uses: actions/setup-go@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          go-version-file: atlas-core/go.mod
          cache-dependency-path: atlas-core/go.sum

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@82606bf257cbaff209d206a39f5134f0cfbfd2ee
        with:
          version: v2.12.2
          working-directory: atlas-core

  test:
    name: Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17.4-alpine
        env:
          POSTGRES_USER: atlas
          POSTGRES_PASSWORD: atlas
          POSTGRES_DB: atlas_core_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U atlas -d atlas_core_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20

    defaults:
      run:
        working-directory: atlas-core

    env:
      ATLAS_TEST_POSTGRES_HOST: localhost
      ATLAS_TEST_POSTGRES_PORT: "5432"
      ATLAS_TEST_POSTGRES_USER: atlas
      ATLAS_TEST_POSTGRES_PASSWORD: atlas
      ATLAS_TEST_POSTGRES_DB: atlas_core_test
      ATLAS_TEST_POSTGRES_SSLMODE: disable

    steps:
      - name: Checkout
        uses: actions/checkout@4a3601121dd01d1626a1e23e37211e3254c1c06c

      - name: Set up Go
        uses: actions/setup-go@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          go-version-file: atlas-core/go.mod
          cache-dependency-path: atlas-core/go.sum

      - name: Download modules
        run: go mod download

      - name: Test
        run: go test -p 1 ./...

  build:
    name: Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: atlas-core
    steps:
      - name: Checkout
        uses: actions/checkout@4a3601121dd01d1626a1e23e37211e3254c1c06c

      - name: Set up Go
        uses: actions/setup-go@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          go-version-file: atlas-core/go.mod
          cache-dependency-path: atlas-core/go.sum

      - name: Download modules
        run: go mod download

      - name: Build
        run: go build ./services/datastorage/cmd/atlas-datastorage ./services/functions/cmd/atlas-functions

  protocol:
    name: Protocol (atlas.py protocol-check)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@4a3601121dd01d1626a1e23e37211e3254c1c06c

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: atlas-protocol/package-lock.json

      - name: Set up Go
        uses: actions/setup-go@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          go-version-file: atlas-protocol/packages/go/go.mod
          cache-dependency-path: atlas-protocol/packages/go/go.sum

      - name: Protocol verification
        run: python3 atlas.py protocol-check
