name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  protocol:
    name: Atlas Protocol
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Enable corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: atlas-protocol/pnpm-lock.yaml

      - name: Verify Atlas Protocol artifacts
        run: python3 atlas.py protocol-check

  format:
    name: Format (gofmt)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: atlas-core
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Enable corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: atlas-protocol/pnpm-lock.yaml

      - name: Sync Atlas Protocol artifacts
        working-directory: .
        run: python3 atlas.py protocol-sync

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: atlas-core/go.mod
          cache-dependency-path: atlas-core/go.sum

      - name: Download modules
        run: go mod download

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "$unformatted"
            exit 1
          fi

  test:
    name: Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17.4-alpine
        env:
          POSTGRES_USER: atlas
          POSTGRES_PASSWORD: atlas
          POSTGRES_DB: atlas_core_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U atlas -d atlas_core_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20

    defaults:
      run:
        working-directory: atlas-core

    env:
      ATLAS_TEST_POSTGRES_HOST: localhost
      ATLAS_TEST_POSTGRES_PORT: "5432"
      ATLAS_TEST_POSTGRES_USER: atlas
      ATLAS_TEST_POSTGRES_PASSWORD: atlas
      ATLAS_TEST_POSTGRES_DB: atlas_core_test
      ATLAS_TEST_POSTGRES_SSLMODE: disable

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Enable corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: atlas-protocol/pnpm-lock.yaml

      - name: Sync Atlas Protocol artifacts
        working-directory: .
        run: python3 atlas.py protocol-sync

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: atlas-core/go.mod
          cache-dependency-path: atlas-core/go.sum

      - name: Download modules
        run: go mod download

      - name: Test
        run: go test -p 1 ./...

  build:
    name: Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: atlas-core
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Enable corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: atlas-protocol/pnpm-lock.yaml

      - name: Sync Atlas Protocol artifacts
        working-directory: .
        run: python3 atlas.py protocol-sync

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: atlas-core/go.mod
          cache-dependency-path: atlas-core/go.sum

      - name: Download modules
        run: go mod download

      - name: Build
        run: go build ./cmd/atlas-core
