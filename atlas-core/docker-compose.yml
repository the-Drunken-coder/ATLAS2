services:
  postgres:
    image: postgres:17.4-alpine
    environment:
      POSTGRES_USER: ${ATLAS_POSTGRES_USER:-atlas}
      POSTGRES_PASSWORD: ${ATLAS_POSTGRES_PASSWORD:-atlas}
      POSTGRES_DB: ${ATLAS_POSTGRES_DB:-atlas_core}
    volumes:
      - atlas-pgdata:/var/lib/postgresql/data
    networks:
      - atlas-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ATLAS_POSTGRES_USER:-atlas} -d ${ATLAS_POSTGRES_DB:-atlas_core}"]
      interval: 2s
      timeout: 3s
      retries: 10
      start_period: 3s

  atlas-datastorage:
    build:
      context: ..
      dockerfile: atlas-core/Dockerfile
      target: atlas-datastorage
    environment:
      ATLAS_POSTGRES_HOST: postgres
      ATLAS_POSTGRES_PORT: "5432"
      ATLAS_POSTGRES_USER: ${ATLAS_POSTGRES_USER:-atlas}
      ATLAS_POSTGRES_PASSWORD: ${ATLAS_POSTGRES_PASSWORD:-atlas}
      ATLAS_POSTGRES_DB: ${ATLAS_POSTGRES_DB:-atlas_core}
      ATLAS_POSTGRES_SSLMODE: ${ATLAS_POSTGRES_SSLMODE:-disable}
      ATLAS_POSTGRES_MAX_CONNS: ${ATLAS_POSTGRES_MAX_CONNS:-8}
      ATLAS_OBJECT_STORAGE_DIR: /var/lib/atlas-datastorage/objects
      ATLAS_LOG_LEVEL: ${ATLAS_LOG_LEVEL:-info}
      ATLAS_READY_FILE: /var/lib/atlas-datastorage/.ready
      ATLAS_DATASTORAGE_LISTEN_ADDR: ${ATLAS_DATASTORAGE_LISTEN_ADDR:-0.0.0.0:8081}
      ATLAS_DATASTORAGE_INTERNAL_TOKEN: ${ATLAS_DATASTORAGE_INTERNAL_TOKEN:?ATLAS_DATASTORAGE_INTERNAL_TOKEN is required}
      ATLAS_RECONCILE_INTERVAL: ${ATLAS_RECONCILE_INTERVAL:-1m}
      ATLAS_RECONCILE_TIMEOUT: ${ATLAS_RECONCILE_TIMEOUT:-30s}
      ATLAS_RUN_ID: ${ATLAS_RUN_ID:-local}
    volumes:
      - atlas-objects:/var/lib/atlas-datastorage/objects
    networks:
      - atlas-internal
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/atlas-datastorage", "--healthcheck"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 3s

  atlas-functions:
    build:
      context: ..
      dockerfile: atlas-core/Dockerfile
      target: atlas-functions
    environment:
      ATLAS_DATASTORAGE_ADDR: ${ATLAS_DATASTORAGE_ADDR:-atlas-datastorage:8081}
      ATLAS_FUNCTIONS_LISTEN_ADDR: ${ATLAS_FUNCTIONS_LISTEN_ADDR:-0.0.0.0:8080}
      ATLAS_LOG_LEVEL: ${ATLAS_LOG_LEVEL:-info}
      ATLAS_READY_FILE: /var/lib/atlas-functions/.ready
      ATLAS_RUN_ID: ${ATLAS_RUN_ID:-local}
      ATLAS_DATASTORAGE_INTERNAL_TOKEN: ${ATLAS_DATASTORAGE_INTERNAL_TOKEN:?ATLAS_DATASTORAGE_INTERNAL_TOKEN is required}
    ports:
      - "127.0.0.1:${ATLAS_FUNCTIONS_HOST_PORT:-8080}:8080"
    networks:
      - atlas-internal
      - atlas-public
    depends_on:
      atlas-datastorage:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/atlas-functions", "--healthcheck"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 3s

volumes:
  atlas-pgdata:
  atlas-objects:

networks:
  atlas-internal:
    internal: true
  atlas-public:
